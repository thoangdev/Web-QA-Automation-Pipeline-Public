name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # nightly at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BASE_URL:           ${{ secrets.BASE_URL    || 'https://www.saucedemo.com' }}
  TEST_USER_USERNAME: ${{ secrets.TEST_USER_USERNAME || 'standard_user' }}
  TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'secret_sauce' }}

jobs:
  # ── 1. Static analysis ──────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  # ── 2. Smoke + API (sharded, every push) ────────────────────────────────────
  smoke:
    name: Smoke & API (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run smoke + API tests
        run: |
          npx playwright test \
            --grep "@smoke|@api" \
            --project=chromium \
            --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-smoke-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  # ── 3. Merge sharded reports ────────────────────────────────────────────────
  merge-smoke-report:
    name: Merge Smoke Report
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-smoke-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: html-report-smoke-${{ github.run_number }}
          path: playwright-report
          retention-days: 14

  # ── 4. Regression (nightly + main pushes only) ──────────────────────────────
  regression:
    name: Regression
    needs: smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep @regression --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-regression-${{ github.run_number }}
          path: blob-report
          retention-days: 14

  # ── 5. Accessibility ─────────────────────────────────────────────────────────
  accessibility:
    name: Accessibility
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep @a11y --project=chromium

  # ── 6. Visual diffs (non-blocking) ──────────────────────────────────────────
  visual:
    name: Visual
    needs: smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep @visual --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-visual-${{ github.run_number }}
          path: blob-report
          retention-days: 7

  # ── 7. Slack notification ───────────────────────────────────────────────────
  notify:
    name: Slack Notification
    needs: [smoke, accessibility, visual]
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ needs.smoke.result == 'success' && '✅' || '❌' }} *${{ github.repository }}* — ${{ github.workflow }}",
              "attachments": [{
                "color": "${{ needs.smoke.result == 'success' && 'good' || 'danger' }}",
                "fields": [
                  { "title": "Branch",       "value": "${{ github.ref_name }}",                     "short": true },
                  { "title": "Triggered by", "value": "${{ github.actor }}",                        "short": true },
                  { "title": "Smoke",        "value": "${{ needs.smoke.result }}",                  "short": true },
                  { "title": "A11y",         "value": "${{ needs.accessibility.result }}",          "short": true },
                  { "title": "Run",          "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false }
                ]
              }]
            }
