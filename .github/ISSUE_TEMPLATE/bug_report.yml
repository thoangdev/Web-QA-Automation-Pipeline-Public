name: Bug report
description: Report a broken test, flaky test, or template defect
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the failure — expected vs actual.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact commands or test names.
      value: |
        1. `npm install`
        2. `npm run test:smoke`
        3. See error in `reports/html/index.html`
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: v20.x.x
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 14.5, Ubuntu 22.04, Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output / trace
      description: Paste relevant terminal output. For traces, attach the trace.zip.
      render: shell
