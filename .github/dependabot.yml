version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5
    groups:
      playwright:
        patterns:
          - '@playwright/*'
          - 'playwright'
      testing:
        patterns:
          - '@axe-core/*'
      dev-tooling:
        patterns:
          - 'typescript'
          - 'typescript-eslint'
          - 'eslint'
          - 'prettier'
          - 'dotenv'
          - '@types/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5
